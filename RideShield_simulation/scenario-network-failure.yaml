name: 'RideShield Network Failure and Retry Test'
version: 1
author: 'RideShield Team'
steps:
  - wait-serial: 'RideShield Core Safety POC - Wokwi'
  - set-control: { part-id: head, control: pressed, value: 1 }
  - set-control: { part-id: strap, control: pressed, value: 1 }
  - set-control: { part-id: gpsFix, control: pressed, value: 1 }
  - set-control: { part-id: lte, control: pressed, value: 1 }
  - set-control: { part-id: speed, control: position, value: 0.45 }
  - wait-serial: 'GPS=FIX'
  - delay: 1000ms

  # Lose both GPS and LTE after obtaining a valid fix.
  - set-control: { part-id: gpsFix, control: pressed, value: 0 }
  - set-control: { part-id: lte, control: pressed, value: 0 }
  - wait-serial: 'GPS=NO_FIX'
  - wait-serial: 'LTE=OFFLINE'

  - set-control:
      part-id: imu
      control: accelX
      value: 8.0
  - set-control:
      part-id: imu
      control: rotationY
      value: 800
  - delay: 300ms
  - set-control:
      part-id: imu
      control: accelX
      value: 0
  - set-control:
      part-id: imu
      control: accelY
      value: 0
  - set-control:
      part-id: imu
      control: accelZ
      value: 1
  - set-control:
      part-id: imu
      control: rotationX
      value: 0
  - set-control:
      part-id: imu
      control: rotationY
      value: 0
  - set-control:
      part-id: imu
      control: rotationZ
      value: 0

  - wait-serial: 'Crash event CONFIRMED'
  - wait-serial: 'GPS: LAST KNOWN'
  - wait-serial: 'SMS: QUEUED FOR RETRY'

  - set-control: { part-id: lte, control: pressed, value: 1 }
  - wait-serial: 'Network restored -> retrying queued emergency alert'
  - wait-serial: 'SMS: SENT SUCCESSFULLY'
