name: 'RideShield Crash Cancel Test'
version: 1
author: 'RideShield Team'
steps:
  - wait-serial: 'RideShield Core Safety POC - Wokwi'
  - set-control: { part-id: head, control: pressed, value: 1 }
  - set-control: { part-id: strap, control: pressed, value: 1 }
  - set-control: { part-id: gpsFix, control: pressed, value: 1 }
  - set-control: { part-id: lte, control: pressed, value: 1 }
  - set-control: { part-id: speed, control: position, value: 0.50 }
  - wait-serial: 'state=READY'
  - set-control:
      part-id: imu
      control: accelX
      value: 6.0
  - set-control:
      part-id: imu
      control: rotationY
      value: 700
  - delay: 300ms
  - set-control:
      part-id: imu
      control: accelX
      value: 0
  - set-control:
      part-id: imu
      control: accelY
      value: 0
  - set-control:
      part-id: imu
      control: accelZ
      value: 1
  - set-control:
      part-id: imu
      control: rotationX
      value: 0
  - set-control:
      part-id: imu
      control: rotationY
      value: 0
  - set-control:
      part-id: imu
      control: rotationZ
      value: 0

  - wait-serial: '10 seconds to cancel emergency alert'
  - delay: 2500ms
  - set-control: { part-id: cancel, control: pressed, value: 1 }
  - delay: 150ms
  - set-control: { part-id: cancel, control: pressed, value: 0 }
  - wait-serial: 'Rider cancelled the emergency alert'
