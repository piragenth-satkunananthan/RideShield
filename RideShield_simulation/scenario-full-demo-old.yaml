name: 'RideShield Full Automated Semi-Final Demo'
version: 1
author: 'RideShield Team'
steps:
  - wait-serial: 'RideShield Core Safety POC - Wokwi'

  # ----------------------------------------------------------
  # A. Helmet-worn validation and crash rejection
  # ----------------------------------------------------------
  - set-control:
      part-id: head
      control: pressed
      value: 1
  - delay: 500ms
  - wait-serial: 'head=YES strap=NO'

  # Try a crash while the strap is not fastened: must be rejected.
  - set-control:
      part-id: crash
      control: pressed
      value: 1
  - delay: 120ms
  - set-control:
      part-id: crash
      control: pressed
      value: 0
  - wait-serial: 'Event ignored: helmet is not verified as worn'

  # Fasten strap -> system must enter READY.
  - set-control:
      part-id: strap
      control: pressed
      value: 1

  # Establish GPS, LTE, and ~60 km/h pre-event speed.
  - set-control:
      part-id: gpsFix
      control: pressed
      value: 1
  - set-control:
      part-id: lte
      control: pressed
      value: 1
  - set-control:
      part-id: speed
      control: position
      value: 0.50
  - wait-serial: 'state=READY'
  - wait-serial: 'GPS=FIX'
  - wait-serial: 'LTE=ONLINE'

  # ----------------------------------------------------------
  # B. Real MPU crash -> rider CANCELS
  # ----------------------------------------------------------
  - set-control:
      part-id: imu
      control: accelX
      value: 6.0
  - set-control:
      part-id: imu
      control: rotationY
      value: 700
  - delay: 300ms
  - set-control:
      part-id: imu
      control: accelX
      value: 0
  - set-control:
      part-id: imu
      control: accelY
      value: 0
  - set-control:
      part-id: imu
      control: accelZ
      value: 1
  - set-control:
      part-id: imu
      control: rotationX
      value: 0
  - set-control:
      part-id: imu
      control: rotationY
      value: 0
  - set-control:
      part-id: imu
      control: rotationZ
      value: 0

  - wait-serial: 'Candidate detected'
  - wait-serial: 'Candidate CONFIRMED by multi-factor check'
  - wait-serial: '10 seconds to cancel emergency alert'
  - delay: 2500ms
  - set-control:
      part-id: cancel
      control: pressed
      value: 1
  - delay: 150ms
  - set-control:
      part-id: cancel
      control: pressed
      value: 0
  - wait-serial: 'Rider cancelled the emergency alert'
  - wait-serial: 'state=READY'

  # ----------------------------------------------------------
  # C. Real MPU crash -> no response -> emergency SMS
  # ----------------------------------------------------------
  - set-control:
      part-id: imu
      control: accelX
      value: 10.0
  - set-control:
      part-id: imu
      control: rotationY
      value: 1000
  - delay: 300ms
  - set-control:
      part-id: imu
      control: accelX
      value: 0
  - set-control:
      part-id: imu
      control: accelY
      value: 0
  - set-control:
      part-id: imu
      control: accelZ
      value: 1
  - set-control:
      part-id: imu
      control: rotationX
      value: 0
  - set-control:
      part-id: imu
      control: rotationY
      value: 0
  - set-control:
      part-id: imu
      control: rotationZ
      value: 0

  - wait-serial: 'Candidate CONFIRMED by multi-factor check'
  - wait-serial: '10 seconds to cancel emergency alert'
  - wait-serial: 'Crash event CONFIRMED'
  - wait-serial: 'GPS: CURRENT FIX'
  - wait-serial: 'SMS: SENT SUCCESSFULLY'

  # Reset the demo while keeping the held helmet/GPS/LTE inputs.
  - set-control:
      part-id: reset
      control: pressed
      value: 1
  - delay: 150ms
  - set-control:
      part-id: reset
      control: pressed
      value: 0
  - wait-serial: 'New state: READY'

  # ----------------------------------------------------------
  # D. GPS lost + LTE lost -> last known location + queued retry
  # ----------------------------------------------------------
  - set-control:
      part-id: gpsFix
      control: pressed
      value: 0
  - set-control:
      part-id: lte
      control: pressed
      value: 0
  - delay: 500ms
  - wait-serial: 'GPS=NO_FIX'
  - wait-serial: 'LTE=OFFLINE'

  - set-control:
      part-id: imu
      control: accelX
      value: 8.0
  - set-control:
      part-id: imu
      control: rotationY
      value: 800
  - delay: 300ms
  - set-control:
      part-id: imu
      control: accelX
      value: 0
  - set-control:
      part-id: imu
      control: accelY
      value: 0
  - set-control:
      part-id: imu
      control: accelZ
      value: 1
  - set-control:
      part-id: imu
      control: rotationX
      value: 0
  - set-control:
      part-id: imu
      control: rotationY
      value: 0
  - set-control:
      part-id: imu
      control: rotationZ
      value: 0

  - wait-serial: 'Candidate CONFIRMED by multi-factor check'
  - wait-serial: 'Crash event CONFIRMED'
  - wait-serial: 'GPS: LAST KNOWN'
  - wait-serial: 'SMS: QUEUED FOR RETRY'

  # Restore LTE and verify automatic retry.
  - set-control:
      part-id: lte
      control: pressed
      value: 1
  - wait-serial: 'Network restored -> retrying queued emergency alert'
  - wait-serial: 'SMS: SENT SUCCESSFULLY'

  # ----------------------------------------------------------
  # E. Print SD evidence
  # ----------------------------------------------------------
  - write-serial: 'L'
  - wait-serial: '===== /events.csv ====='
  - wait-serial: '===== END ====='

  - write-serial: 'B'
  - wait-serial: '===== /blackbox.csv ====='
  - wait-serial: '===== END ====='
