[platformio]
default_envs = esp32s3_bench
[env]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DWEBSOCKETS_SERVER_CLIENT_MAX=2
lib_deps =
  links2004/WebSockets@2.6.1
  mikalhart/TinyGPSPlus@1.0.3
[env:esp32s3_bench]
build_flags = ${env.build_flags} -DRS_BENCH=1
[env:esp32s3_hardware]
build_flags = ${env.build_flags} -DRS_BENCH=0
[env:esp32s3_compile_all]
build_flags =
  ${env.build_flags}
  -DRS_BENCH=0
  -DRS_ENABLE_OUTPUTS=1
  -DRS_ENABLE_GPS=1
  -DRS_ENABLE_SD=1
  -DRS_ENABLE_LTE=1
  -DRS_ALLOW_SMS=0

; Core-only simulator harness: no Wi-Fi, SD, modem, or physical IMU adapter.
[env:esp32s3_wokwi]
build_flags = ${env.build_flags} -DRS_BENCH=1 -DRS_WOKWI=1
build_src_filter = -<*> +<wokwi_main.cpp>
lib_deps =
