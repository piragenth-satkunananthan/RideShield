[platformio]
default_envs = nodemcu32s_bringup

[env]
platform = espressif32@6.10.0
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DWEBSOCKETS_SERVER_CLIENT_MAX=2
lib_deps =
  links2004/WebSockets@2.6.1
  mikalhart/TinyGPSPlus@1.0.3

; Real MPU6050; local outputs, GNSS, SD, LTE, and live SMS remain disabled.
[env:nodemcu32s_bringup]
build_flags =
  ${env.build_flags}
  -DRS_BENCH=0
  -DRS_ALLOW_SMS=0

; Compile-only full-interface profile. Verify the pin map, voltage levels,
; power supplies, and module wiring before connecting or uploading.
[env:nodemcu32s_compile_all]
build_flags =
  ${env.build_flags}
  -DRS_BENCH=0
  -DRS_ENABLE_OUTPUTS=1
  -DRS_ENABLE_GPS=1
  -DRS_ENABLE_SD=1
  -DRS_ENABLE_LTE=1
  -DRS_ALLOW_SMS=0
