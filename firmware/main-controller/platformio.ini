[platformio]
default_envs = nodemcu32s_core

[env]
platform = espressif32@6.10.0
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DWEBSOCKETS_SERVER_CLIENT_MAX=2
lib_deps =
  links2004/WebSockets@2.6.1
  mikalhart/TinyGPSPlus@1.0.3
  adafruit/Adafruit_VL53L0X@1.2.5

[features]
core_flags =
  ${env.build_flags}
  -DRS_BENCH=0
  -DRS_ENABLE_OUTPUTS=1
  -DRS_ENABLE_GPS=1
  -DRS_ENABLE_SD=1
  -DRS_ENABLE_LTE=1
  -DRS_ENABLE_STRAP=1
  -DRS_ENABLE_MQ=1

; All connected peripherals; SMS transport is a dry run until configured.
[env:nodemcu32s_core]
build_flags =
  ${features.core_flags}
  -DRS_ALLOW_SMS=0

; Real MPU-9250; local outputs, GNSS, SD, LTE, and live SMS remain disabled.
[env:nodemcu32s_bringup]
build_flags =
  ${env.build_flags}
  -DRS_BENCH=0
  -DRS_ALLOW_SMS=0

; Compile-only full-interface profile. Verify the pin map, voltage levels,
; power supplies, and module wiring before connecting or uploading.
[env:nodemcu32s_compile_all]
build_flags =
  ${features.core_flags}
  -DRS_ALLOW_SMS=0

; Requires RS_SMS_NUMBER in ignored include/local_config.h. Never use for a
; fixture test unless the recipient expects the test messages.
[env:nodemcu32s_live_sms]
build_flags =
  ${features.core_flags}
  -DRS_ALLOW_SMS=1
