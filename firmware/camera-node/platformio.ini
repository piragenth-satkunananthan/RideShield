[platformio]
default_envs = front

[env]
platform = espressif32@6.10.0
board = esp32cam
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue

[env:front]
build_flags =
  ${env.build_flags}
  -DRS_CAMERA_REAR=0

[env:rear]
build_flags =
  ${env.build_flags}
  -DRS_CAMERA_REAR=1
